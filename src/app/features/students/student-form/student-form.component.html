<div class="page-container">
  <div class="page-header">
    <h1>{{ isEditMode ? 'Modifier l\'étudiant' : 'Ajouter un étudiant' }}</h1>
  </div>

  <div class="alert alert-error" *ngIf="error">
    {{ error }}
  </div>

  <div class="card">
    <form [formGroup]="studentForm" (ngSubmit)="onSubmit()">
      <!-- Informations personnelles -->
      <div class="form-section">
        <h3>Informations personnelles</h3>
        <div class="form-grid">
          <!-- Matricule -->
          <div class="form-group">
            <label for="matricule">Matricule <span class="required">*</span></label>
            <input
              type="text"
              id="matricule"
              formControlName="matricule"
              placeholder="ETU12345"
              [class.error]="matricule?.invalid && matricule?.touched"
            />
            <span class="error" *ngIf="matricule?.invalid && matricule?.touched">
              Le matricule est requis
            </span>
          </div>

          <!-- Email -->
          <div class="form-group">
            <label for="email">Email <span class="required">*</span></label>
            <input
              type="email"
              id="email"
              formControlName="email"
              placeholder="etudiant@example.com"
              [class.error]="email?.invalid && email?.touched"
            />
            <span class="error" *ngIf="email?.invalid && email?.touched">
              <span *ngIf="email?.errors?.['required']">L'email est requis</span>
              <span *ngIf="email?.errors?.['email']">Email invalide</span>
            </span>
          </div>

          <!-- Prénom -->
          <div class="form-group">
            <label for="firstName">Prénom <span class="required">*</span></label>
            <input
              type="text"
              id="firstName"
              formControlName="firstName"
              placeholder="Jean"
              [class.error]="firstName?.invalid && firstName?.touched"
            />
            <span class="error" *ngIf="firstName?.invalid && firstName?.touched">
              Le prénom est requis
            </span>
          </div>

          <!-- Nom -->
          <div class="form-group">
            <label for="lastName">Nom <span class="required">*</span></label>
            <input
              type="text"
              id="lastName"
              formControlName="lastName"
              placeholder="Dupont"
              [class.error]="lastName?.invalid && lastName?.touched"
            />
            <span class="error" *ngIf="lastName?.invalid && lastName?.touched">
              Le nom est requis
            </span>
          </div>

          <!-- Genre -->
          <div class="form-group">
            <label for="gender">Genre <span class="required">*</span></label>
            <select id="gender" formControlName="gender">
              <option value="M">Masculin</option>
              <option value="F">Féminin</option>
            </select>
          </div>

          <!-- Date de naissance -->
          <div class="form-group">
            <label for="dateOfBirth">Date de naissance</label>
            <input
              type="date"
              id="dateOfBirth"
              formControlName="dateOfBirth"
            />
          </div>

          <!-- Téléphone -->
          <div class="form-group">
            <label for="phone">Téléphone</label>
            <input
              type="tel"
              id="phone"
              formControlName="phone"
              placeholder="+237 6XX XX XX XX"
            />
          </div>

          <!-- Adresse -->
          <div class="form-group full-width">
            <label for="address">Adresse</label>
            <textarea
              id="address"
              formControlName="address"
              rows="2"
              placeholder="Adresse complète"
            ></textarea>
          </div>
        </div>
      </div>

      <!-- Informations académiques -->
      <div class="form-section">
        <h3>Informations académiques</h3>
        <div class="form-grid">
          <!-- Statut -->
          <div class="form-group">
            <label for="studentStatus">Statut <span class="required">*</span></label>
            <select id="studentStatus" formControlName="studentStatus">
              <option *ngFor="let status of statuses" [value]="status">
                {{ studentService.getStatusLabel(status) }}
              </option>
            </select>
          </div>

          <!-- Régime -->
          <div class="form-group">
            <label for="regime">Régime <span class="required">*</span></label>
            <select id="regime" formControlName="regime">
              <option *ngFor="let regime of regimes" [value]="regime">
                {{ studentService.getRegimeLabel(regime) }}
              </option>
            </select>
          </div>

          <!-- Programme ID -->
          <div class="form-group">
            <label for="programId">ID Programme</label>
            <input
              type="text"
              id="programId"
              formControlName="programId"
              placeholder="1"
            />
          </div>

          <!-- Programme Name -->
          <div class="form-group">
            <label for="programName">Nom du programme</label>
            <input
              type="text"
              id="programName"
              formControlName="programName"
              placeholder="Informatique"
            />
          </div>

          <!-- Niveau Code -->
          <div class="form-group">
            <label for="levelCode">Code niveau</label>
            <input
              type="text"
              id="levelCode"
              formControlName="levelCode"
              placeholder="L1, L2, L3..."
            />
          </div>

          <!-- Niveau ID -->
          <div class="form-group">
            <label for="levelId">ID Niveau</label>
            <input
              type="text"
              id="levelId"
              formControlName="levelId"
              placeholder="1"
            />
          </div>

          <!-- Promotion -->
          <div class="form-group">
            <label for="promotion">Promotion</label>
            <input
              type="text"
              id="promotion"
              formControlName="promotion"
              placeholder="2023-2024"
            />
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="form-actions">
        <button type="button" class="btn btn-outline" routerLink="/students">
          Annuler
        </button>
        <button 
          type="submit" 
          class="btn btn-primary" 
          [disabled]="loading || studentForm.invalid">
          <span *ngIf="!loading">
            {{ isEditMode ? 'Modifier' : 'Créer' }}
          </span>
          <span *ngIf="loading" class="loading-spinner"></span>
        </button>
      </div>
    </form>
  </div>
</div>
