<div class="page-container">
  <div class="page-header">
    <h1>{{ isEditMode ? 'Modifier l\'enseignant' : 'Ajouter un enseignant' }}</h1>
  </div>

  <div class="alert alert-error" *ngIf="error">
    {{ error }}
  </div>

  <div class="card">
    <form [formGroup]="teacherForm" (ngSubmit)="onSubmit()">
      <!-- Informations personnelles -->
      <div class="form-section">
        <h3>Informations personnelles</h3>
        <div class="form-grid">
          <div class="form-group">
            <label for="matricule">Matricule <span class="required">*</span></label>
            <input
              type="text"
              id="matricule"
              formControlName="matricule"
              placeholder="PROF12345"
              [class.error]="matricule?.invalid && matricule?.touched"
            />
            <span class="error" *ngIf="matricule?.invalid && matricule?.touched">
              Le matricule est requis
            </span>
          </div>

          <div class="form-group">
            <label for="email">Email <span class="required">*</span></label>
            <input
              type="email"
              id="email"
              formControlName="email"
              placeholder="enseignant@example.com"
              [class.error]="email?.invalid && email?.touched"
            />
            <span class="error" *ngIf="email?.invalid && email?.touched">
              <span *ngIf="email?.errors?.['required']">L'email est requis</span>
              <span *ngIf="email?.errors?.['email']">Email invalide</span>
            </span>
          </div>

          <div class="form-group">
            <label for="firstName">Prénom <span class="required">*</span></label>
            <input
              type="text"
              id="firstName"
              formControlName="firstName"
              placeholder="Jean"
              [class.error]="firstName?.invalid && firstName?.touched"
            />
            <span class="error" *ngIf="firstName?.invalid && firstName?.touched">
              Le prénom est requis
            </span>
          </div>

          <div class="form-group">
            <label for="lastName">Nom <span class="required">*</span></label>
            <input
              type="text"
              id="lastName"
              formControlName="lastName"
              placeholder="Dupont"
              [class.error]="lastName?.invalid && lastName?.touched"
            />
            <span class="error" *ngIf="lastName?.invalid && lastName?.touched">
              Le nom est requis
            </span>
          </div>

          <div class="form-group">
            <label for="gender">Genre <span class="required">*</span></label>
            <select id="gender" formControlName="gender">
              <option value="M">Masculin</option>
              <option value="F">Féminin</option>
            </select>
          </div>

          <div class="form-group">
            <label for="dateOfBirth">Date de naissance</label>
            <input
              type="date"
              id="dateOfBirth"
              formControlName="dateOfBirth"
            />
          </div>

          <div class="form-group">
            <label for="phone">Téléphone</label>
            <input
              type="tel"
              id="phone"
              formControlName="phone"
              placeholder="+237 6XX XX XX XX"
            />
          </div>

          <div class="form-group full-width">
            <label for="address">Adresse</label>
            <textarea
              id="address"
              formControlName="address"
              rows="2"
              placeholder="Adresse complète"
            ></textarea>
          </div>
        </div>
      </div>

      <!-- Informations professionnelles -->
      <div class="form-section">
        <h3>Informations professionnelles</h3>
        <div class="form-grid">
          <div class="form-group">
            <label for="grade">Grade <span class="required">*</span></label>
            <select id="grade" formControlName="grade">
              <option *ngFor="let g of grades" [value]="g">
                {{ teacherService.getGradeLabel(g) }}
              </option>
            </select>
          </div>

          <div class="form-group">
            <label for="teacherType">Type <span class="required">*</span></label>
            <select id="teacherType" formControlName="teacherType">
              <option *ngFor="let type of teacherTypes" [value]="type">
                {{ teacherService.getTeacherTypeLabel(type) }}
              </option>
            </select>
          </div>

          <div class="form-group">
            <label for="specialty">Spécialité</label>
            <input
              type="text"
              id="specialty"
              formControlName="specialty"
              placeholder="Informatique, Mathématiques..."
            />
          </div>

          <div class="form-group">
            <label for="departmentId">ID Département</label>
            <input
              type="text"
              id="departmentId"
              formControlName="departmentId"
              placeholder="1"
            />
          </div>

          <div class="form-group">
            <label for="departmentName">Nom du département</label>
            <input
              type="text"
              id="departmentName"
              formControlName="departmentName"
              placeholder="Département d'Informatique"
            />
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="form-actions">
        <button type="button" class="btn btn-outline" routerLink="/teachers">
          Annuler
        </button>
        <button 
          type="submit" 
          class="btn btn-primary" 
          [disabled]="loading || teacherForm.invalid">
          <span *ngIf="!loading">
            {{ isEditMode ? 'Modifier' : 'Créer' }}
          </span>
          <span *ngIf="loading" class="loading-spinner"></span>
        </button>
      </div>
    </form>
  </div>
</div>
