<div class="register-container">
  <h2 class="register-title">Inscription</h2>
  <p class="register-subtitle">Créez votre compte</p>

  <div class="alert alert-error" *ngIf="error">
    {{ error }}
  </div>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <div class="grid grid-cols-2">
      <div class="form-group">
        <label for="firstName">Prénom</label>
        <input
          type="text"
          id="firstName"
          formControlName="firstName"
          placeholder="Jean"
          [class.error]="firstName?.invalid && firstName?.touched"
        />
        <span class="error" *ngIf="firstName?.invalid && firstName?.touched">
          Le prénom est requis
        </span>
      </div>

      <div class="form-group">
        <label for="lastName">Nom</label>
        <input
          type="text"
          id="lastName"
          formControlName="lastName"
          placeholder="Dupont"
          [class.error]="lastName?.invalid && lastName?.touched"
        />
        <span class="error" *ngIf="lastName?.invalid && lastName?.touched">
          Le nom est requis
        </span>
      </div>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        formControlName="email"
        placeholder="jean.dupont@example.com"
        [class.error]="email?.invalid && email?.touched"
      />
      <span class="error" *ngIf="email?.invalid && email?.touched">
        <span *ngIf="email?.errors?.['required']">L'email est requis</span>
        <span *ngIf="email?.errors?.['email']">Email invalide</span>
      </span>
    </div>

    <div class="form-group">
      <label for="matricule">Matricule</label>
      <input
        type="text"
        id="matricule"
        formControlName="matricule"
        placeholder="MAT12345"
        [class.error]="matricule?.invalid && matricule?.touched"
      />
      <span class="error" *ngIf="matricule?.invalid && matricule?.touched">
        Le matricule est requis
      </span>
    </div>

    <div class="form-group">
      <label for="gender">Genre</label>
      <select id="gender" formControlName="gender">
        <option value="M">Masculin</option>
        <option value="F">Féminin</option>
        <option value="O">Autre</option>
      </select>
    </div>

    <div class="form-group">
      <label for="password">Mot de passe</label>
      <input
        type="password"
        id="password"
        formControlName="password"
        placeholder="••••••••"
        [class.error]="password?.invalid && password?.touched"
      />
      <span class="error" *ngIf="password?.invalid && password?.touched">
        <span *ngIf="password?.errors?.['required']">Le mot de passe est requis</span>
        <span *ngIf="password?.errors?.['minlength']">Minimum 8 caractères</span>
      </span>
    </div>

    <div class="form-group">
      <label for="password_confirmation">Confirmer le mot de passe</label>
      <input
        type="password"
        id="password_confirmation"
        formControlName="password_confirmation"
        placeholder="••••••••"
        [class.error]="password_confirmation?.invalid && password_confirmation?.touched"
      />
      <span class="error" *ngIf="password_confirmation?.invalid && password_confirmation?.touched">
        <span *ngIf="password_confirmation?.errors?.['required']">La confirmation est requise</span>
        <span *ngIf="password_confirmation?.errors?.['passwordMismatch']">Les mots de passe ne correspondent pas</span>
      </span>
    </div>

    <button type="submit" class="btn btn-primary w-full btn-lg" [disabled]="loading || registerForm.invalid">
      <span *ngIf="!loading">S'inscrire</span>
      <span *ngIf="loading" class="loading-spinner"></span>
    </button>
  </form>

  <div class="register-footer">
    <p>Vous avez déjà un compte ? <a routerLink="/auth/login">Se connecter</a></p>
  </div>
</div>
