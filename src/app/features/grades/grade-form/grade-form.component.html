<div class="page-container">
  <div class="page-header">
    <h1>{{ isEditMode ? 'Modifier la note' : 'Saisir une note' }}</h1>
  </div>

  <div class="alert alert-error" *ngIf="error">{{ error }}</div>

  <div class="card">
    <form [formGroup]="gradeForm" (ngSubmit)="onSubmit()">
      <div class="form-section">
        <h3>Informations générales</h3>
        <div class="form-grid">
          <div class="form-group">
            <label>ID Étudiant <span class="required">*</span></label>
            <input type="number" formControlName="studentId" />
          </div>
          <div class="form-group">
            <label>ID ECUE <span class="required">*</span></label>
            <input type="number" formControlName="ecueId" />
          </div>
          <div class="form-group">
            <label>ID Semestre <span class="required">*</span></label>
            <input type="number" formControlName="semesterId" />
          </div>
          <div class="form-group">
            <label>ID Année académique <span class="required">*</span></label>
            <input type="number" formControlName="academicYearId" />
          </div>
        </div>
      </div>

      <div class="form-section">
        <h3>Notes</h3>
        <div class="form-grid">
          <div class="form-group">
            <label>CC1</label>
            <input type="number" formControlName="gradeCC1" min="0" max="20" step="0.01" />
            <label class="checkbox-label">
              <input type="checkbox" formControlName="isAbsentCC1" /> Absent
            </label>
          </div>
          <div class="form-group">
            <label>CC2</label>
            <input type="number" formControlName="gradeCC2" min="0" max="20" step="0.01" />
            <label class="checkbox-label">
              <input type="checkbox" formControlName="isAbsentCC2" /> Absent
            </label>
          </div>
          <div class="form-group">
            <label>Examen</label>
            <input type="number" formControlName="gradeExam" min="0" max="20" step="0.01" />
          </div>
          <div class="form-group full-width">
            <label>Commentaire enseignant</label>
            <textarea formControlName="teacherComment" rows="3"></textarea>
          </div>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-outline" routerLink="/grades">Annuler</button>
        <button type="submit" class="btn btn-primary" [disabled]="loading || gradeForm.invalid">
          {{ isEditMode ? 'Modifier' : 'Créer' }}
        </button>
      </div>
    </form>
  </div>
</div>
